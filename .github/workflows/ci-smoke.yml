name: CI Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint (Syntax Check)
        run: npm run lint

      - name: Unit and Integration Tests
        run: npm test

      - name: End-to-End Smoke
        run: npm run smoke:e2e

      - name: Storage Health Gate
        run: npm run ci:storage-health

      - name: Storage Replay Benchmark Gate
        run: npm run ci:storage-benchmark

      - name: Session Query Benchmark Gate
        run: npm run ci:query-benchmark

      - name: Analysis Benchmark Gate
        run: npm run ci:analysis-benchmark

      - name: Restore Long-Horizon Benchmark History
        uses: actions/cache@v4
        with:
          path: artifacts/benchmark-history/long-horizon-history.json
          key: long-horizon-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            long-horizon-history-${{ runner.os }}-

      - name: Long Horizon Benchmark Gate
        run: npm run ci:long-horizon-benchmark
        env:
          CI_LONG_HORIZON_BENCH_USE_BASELINE_BUDGETS: 1

      - name: Long Horizon Calibration
        if: always()
        run: npm run ci:long-horizon-calibrate

      - name: Recovery Proof Gate
        run: npm run ci:recovery-proof

      - name: API SLO Gate
        run: npm run ci:api-slo

      - name: Upload Storage Status Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-status
          path: artifacts/storage-status.json
          if-no-files-found: warn

      - name: Upload Storage Benchmark Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-benchmark
          path: artifacts/storage-benchmark.json
          if-no-files-found: warn

      - name: Upload Query Benchmark Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: query-benchmark
          path: artifacts/query-benchmark.json
          if-no-files-found: warn

      - name: Upload Analysis Benchmark Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-benchmark
          path: artifacts/analysis-benchmark.json
          if-no-files-found: warn

      - name: Upload Long Horizon Benchmark Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-horizon-benchmark
          path: artifacts/long-horizon-benchmark.json
          if-no-files-found: warn

      - name: Upload Long Horizon Calibration Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-horizon-calibration
          path: artifacts/long-horizon-calibration.json
          if-no-files-found: warn

      - name: Upload Recovery Proof Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-proof
          path: artifacts/recovery-proof.json
          if-no-files-found: warn

      - name: Upload API SLO Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-slo
          path: artifacts/api-slo.json
          if-no-files-found: warn
